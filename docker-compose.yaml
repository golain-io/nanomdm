# ARM64: platform is set to linux/arm64 below. On an ARM64 host run:
#   docker compose build && docker compose up -d
# For amd64, remove the "platform: linux/arm64" line from each service.
services:
  scep:
    platform: linux/arm64
    build:
      context: .
      dockerfile: scep/Dockerfile
    container_name: nanomdm-scep
    volumes:
      - ./scep/depot:/app/depot
    environment:
      - SCEP_CHALLENGE=nanomdm
      - SCEP_PORT=8080
      - SCEP_ALLOWRENEW=0
      - SCEP_DEBUG=true
      - SCEP_CERT_RENEW=0
    networks:
      - nanomdm
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scep.rule=Host(`scep.golain.io`)"
      - "traefik.http.routers.scep.entrypoints=websecure"
      - "traefik.http.routers.scep.tls=true"
      - "traefik.http.routers.scep.tls.certresolver=le"
      - "traefik.http.services.scep.loadbalancer.server.port=8080"

  # NanoMDM Server with PostgreSQL
  nanomdm:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nanomdm-server
    environment:
      - NANOMDM_DEBUG=true
      - NANOMDM_LISTEN=:9000
    volumes:
      - ./certs:/app/certs:ro
    networks:
      - nanomdm
      - proxy
      - queue
    depends_on:
      - scep
    restart: unless-stopped
    command:
      - "/app/nanomdm"
      - "-ca"
      - "/app/ca.pem"
      - "-api"
      - "QdYgcU2n0dsXN55Yt53gZnUe"
      - "-debug"
      - "-storage"
      - "pgsql"
      - "-storage-dsn"
      - "postgres://nanomdm:OWFG6kDT5eSfEi2csaZOlAhE@golain-prod-alpha-db.couz0urd95oe.ap-south-1.rds.amazonaws.com:5432/nanomdm?sslmode=require"
      - "-amqps-conn"
      - "amqps://rabbitmq:ef19e2ji@queue:5671/"
      - "-amqps-ca-cert"
      - "/app/certs/rabbitmq-ca.pem"
      - "-amqps-client-cert"
      - "/app/certs/rabbitmq-client.pem"
      - "-amqps-client-key"
      - "/app/certs/rabbitmq-client.key"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nanomdm.rule=Host(`nanomdm.golain.io`)"
      - "traefik.http.routers.nanomdm.entrypoints=websecure"
      - "traefik.http.routers.nanomdm.tls=true"
      - "traefik.http.routers.nanomdm.tls.certresolver=le"
      - "traefik.http.services.nanomdm.loadbalancer.server.port=9000"

  dep-broker:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.dep-broker
    container_name: dep-broker
    environment:
      - DEP_BROKER_LISTEN=:9010
      - DEP_BROKER_STORAGE=/app/dep_broker_data
    volumes:
      - ./dep_broker_data:/app/dep_broker_data
    networks:
      - nanomdm
      - proxy
    restart: unless-stopped
    command: []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.depbroker.rule=Host(`dep.mdm.golain.io`)"
      - "traefik.http.routers.depbroker.entrypoints=websecure"
      - "traefik.http.routers.depbroker.tls=true"
      - "traefik.http.routers.depbroker.tls.certresolver=le"
      - "traefik.http.services.depbroker.loadbalancer.server.port=9010"

volumes:
  postgres_nanomdm_data:
    driver: local

networks:
  nanomdm:
    external: true
  proxy:
    external: true
  queue:
    external: true
